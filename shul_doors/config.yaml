name: Shul Manager
version: "0.2.85"
slug: shul_doors
description: Runs the shul's doors, the mikva magnet and the parking lot by zmanim, Jewish holidays, events and situations.
url: https://github.com/bobovbhmd-gif/shul-doors-addon
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:door
panel_title: Shul Manager
panel_admin: false
homeassistant_api: true
options:
  mode: practice
  protector_url: ""
  protector_username: ""
  protector_password: ""
  partition: ""
  pilot_doors: ""
  sync_time: "00:30"
  horizon_days: 30
  budget: 24
  anthropic_api_key: ""
  ai_model: "claude-sonnet-5-5"
  whisper_host: "core-whisper"
  whisper_port: 10300
  openai_api_key: ""
  stt_model: "gpt-4o-transcribe"
  stt_live: true
  sms_mode: test
  twilio_account_sid: ""
  twilio_api_key_sid: ""
  twilio_api_key_secret: ""
  twilio_messaging_service_sid: ""
  mikva_url: ""
  atrium_url: ""
  atrium_username: ""
  atrium_password: ""
schema:
  mode: list(practice|pilot|live|restore)
  protector_url: str?
  protector_username: str?
  protector_password: password?
  partition: str?
  pilot_doors: str?
  sync_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  horizon_days: int(7,90)
  budget: int(4,30)
  anthropic_api_key: password?
  ai_model: str?
  whisper_host: str?
  whisper_port: port?
  openai_api_key: password?
  stt_model: str?
  stt_live: bool?
  cloudflare_api_token: password?
  cloudflare_account_id: str?
  cloudflare_access_group: str?
  cloudflare_always_allow: str?
  smtp2go_api_key: password?
  email_from: str?
  sms_mode: list(off|test|live)
  twilio_account_sid: str?
  twilio_api_key_sid: str?
  twilio_api_key_secret: password?
  twilio_messaging_service_sid: str?
  mikva_url: str?
  mikva_username: str?
  mikva_password: password?
  atrium_url: str?
  atrium_username: str?
  atrium_password: password?
